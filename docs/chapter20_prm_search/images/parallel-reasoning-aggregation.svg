<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="t d"><title id="t">并行推理与答案汇总</title><desc id="d">同一道题并行生成多条独立路径，随后规范化答案并通过投票、验证器或协调器汇总。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 16px 'Songti SC',serif;fill:#202936}.s{font:13px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="25" y="85" width="150" height="85" rx="12" class="b"/><text x="100" y="134" text-anchor="middle" class="t">同一道题</text><rect x="235" y="15" width="150" height="55" rx="10" class="c"/><text x="310" y="49" text-anchor="middle" class="t">路径 1</text><rect x="235" y="77" width="150" height="55" rx="10" class="c"/><text x="310" y="111" text-anchor="middle" class="t">路径 2</text><rect x="235" y="139" width="150" height="55" rx="10" class="c"/><text x="310" y="173" text-anchor="middle" class="t">路径 3</text><rect x="235" y="201" width="150" height="55" rx="10" class="c"/><text x="310" y="235" text-anchor="middle" class="t">路径 4</text><rect x="485" y="85" width="195" height="85" rx="12" class="b"/><text x="582" y="120" text-anchor="middle" class="t">规范化与汇总</text><text x="582" y="147" text-anchor="middle" class="s">先处理等价答案</text><rect x="780" y="75" width="195" height="105" rx="12" class="c"/><text x="877" y="108" text-anchor="middle" class="t">得到最终输出</text><text x="877" y="137" text-anchor="middle" class="s">多数投票 / 验证器</text><text x="877" y="160" text-anchor="middle" class="s">或协调模型</text><path d="M175 127 235 42M175 127 235 104M175 127 235 166M175 127 235 228M385 42 485 105M385 104 485 120M385 166 485 135M385 228 485 150M680 127H780" class="a"/></svg>
