<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="t d"><title id="t">推理时搜索树</title><desc id="d">共同前缀扩展为多个候选步骤，高分分支继续扩展，低分分支停止，其他分支保留探索机会。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.e{fill:#fff1f0;stroke:#b64a4a;stroke-width:1.7}.t{font:600 16px 'Songti SC',serif;fill:#202936}.s{font:13px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="385" y="15" width="230" height="70" rx="12" class="b"/><text x="500" y="44" text-anchor="middle" class="t">共同的题目与推理前缀</text><text x="500" y="68" text-anchor="middle" class="s">共享一次计算</text><rect x="80" y="125" width="210" height="70" rx="12" class="c"/><text x="185" y="154" text-anchor="middle" class="t">候选步骤 A</text><text x="185" y="178" text-anchor="middle" class="s">高分，继续扩展</text><rect x="395" y="125" width="210" height="70" rx="12" class="e"/><text x="500" y="154" text-anchor="middle" class="t">候选步骤 B</text><text x="500" y="178" text-anchor="middle" class="s">低分，停止或回退</text><rect x="710" y="125" width="210" height="70" rx="12" class="b"/><text x="815" y="154" text-anchor="middle" class="t">候选步骤 C</text><text x="815" y="178" text-anchor="middle" class="s">保留探索机会</text><rect x="80" y="225" width="210" height="48" rx="10" class="c"/><text x="185" y="255" text-anchor="middle" class="s">下一层候选</text><rect x="710" y="225" width="210" height="48" rx="10" class="b"/><text x="815" y="255" text-anchor="middle" class="s">稍后再访问</text><path d="M450 85 185 125M500 85V125M550 85 815 125M185 195V225M815 195V225" class="a"/></svg>
