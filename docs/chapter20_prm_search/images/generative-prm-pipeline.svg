<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d"><title id="t">生成式PRM的评价过程</title><desc id="d">生成式PRM读取题目与步骤，生成检查依据，指出错误位置，再输出可抽取判断供排序或搜索。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 17px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="25" y="70" width="190" height="85" rx="12" class="b"/><text x="120" y="105" text-anchor="middle" class="t">题目与当前步骤</text><text x="120" y="132" text-anchor="middle" class="s">包含前面的推理上下文</text><rect x="265" y="70" width="190" height="85" rx="12" class="c"/><text x="360" y="105" text-anchor="middle" class="t">生成检查过程</text><text x="360" y="132" text-anchor="middle" class="s">复算、引用规则与对照</text><rect x="505" y="70" width="210" height="85" rx="12" class="c"/><text x="610" y="105" text-anchor="middle" class="t">指出错误位置</text><text x="610" y="132" text-anchor="middle" class="s">保留自然语言依据</text><rect x="765" y="70" width="210" height="85" rx="12" class="b"/><text x="870" y="105" text-anchor="middle" class="t">输出最终判断</text><text x="870" y="132" text-anchor="middle" class="s">用于排序、搜索或调试</text><path d="M215 112H265M455 112H505M715 112H765" class="a"/></svg>
