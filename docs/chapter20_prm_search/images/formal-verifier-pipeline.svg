<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d"><title id="t">形式化验证流水线</title><desc id="d">自然语言题目先翻译为形式命题，模型生成Lean证明，内核检查后给出二值奖励，翻译一致性需要单独核对。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.g{fill:#fff8eb;stroke:#a9772e;stroke-width:1.7}.t{font:600 16px 'Songti SC',serif;fill:#202936}.s{font:13px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#9a6a28;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect x="25" y="65" width="165" height="85" rx="12" class="b"/><text x="107" y="114" text-anchor="middle" class="t">自然语言题目</text><rect x="230" y="65" width="165" height="85" rx="12" class="c"/><text x="312" y="101" text-anchor="middle" class="t">形式命题</text><text x="312" y="128" text-anchor="middle" class="s">Lean / Coq / Isabelle</text><rect x="435" y="65" width="180" height="85" rx="12" class="b"/><text x="525" y="101" text-anchor="middle" class="t">生成候选证明</text><text x="525" y="128" text-anchor="middle" class="s">tactic 与子目标</text><rect x="655" y="65" width="155" height="85" rx="12" class="c"/><text x="732" y="101" text-anchor="middle" class="t">内核检查</text><text x="732" y="128" text-anchor="middle" class="s">固定形式规则</text><rect x="850" y="65" width="125" height="85" rx="12" class="b"/><text x="912" y="101" text-anchor="middle" class="t">奖励</text><text x="912" y="128" text-anchor="middle" class="s">接受 1 / 拒绝 0</text><rect x="180" y="195" width="330" height="45" rx="10" class="g"/><text x="345" y="223" text-anchor="middle" class="s">原题与形式命题的语义一致性需单独核对</text><path d="M190 107H230M395 107H435M615 107H655M810 107H850" class="a"/><path d="M312 150V195" class="r"/></svg>
