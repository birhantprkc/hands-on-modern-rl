<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">结果奖励与过程反馈</title><desc id="d">中间步骤首次出错但最终结论碰巧正确时，结果奖励看不到错误，过程反馈可以定位错误位置。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.e{fill:#fff1f0;stroke:#b64a4a;stroke-width:1.7}.t{font:600 17px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#9a6a28;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect x="25" y="60" width="150" height="75" rx="12" class="b"/><text x="100" y="104" text-anchor="middle" class="t">步骤 1 正确</text><rect x="215" y="60" width="150" height="75" rx="12" class="b"/><text x="290" y="104" text-anchor="middle" class="t">步骤 2 正确</text><rect x="405" y="60" width="170" height="75" rx="12" class="e"/><text x="490" y="92" text-anchor="middle" class="t">步骤 3 出错</text><text x="490" y="117" text-anchor="middle" class="s">错误从这里传播</text><rect x="615" y="60" width="175" height="75" rx="12" class="b"/><text x="702" y="92" text-anchor="middle" class="t">最终结论正确</text><text x="702" y="117" text-anchor="middle" class="s">可能只是碰巧</text><rect x="830" y="35" width="145" height="75" rx="12" class="b"/><text x="902" y="79" text-anchor="middle" class="t">结果奖励 1</text><rect x="405" y="175" width="360" height="55" rx="12" class="c"/><text x="585" y="209" text-anchor="middle" class="t">过程反馈定位首次错误</text><path d="M175 97H215M365 97H405M575 97H615M790 97 830 72" class="a"/><path d="M490 135V175" class="r"/></svg>
