<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d"><title id="t">判别式PRM的数据与使用流水线</title><desc id="d">题目和推理前缀经过步骤切分与标注，训练分类评价器，输出类别概率用于重排序或强化学习。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 16px 'Songti SC',serif;fill:#202936}.s{font:13px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="20" y="70" width="155" height="85" rx="12" class="b"/><text x="97" y="105" text-anchor="middle" class="t">题目与推理前缀</text><text x="97" y="132" text-anchor="middle" class="s">必须保留上下文</text><rect x="210" y="70" width="130" height="85" rx="12" class="b"/><text x="275" y="119" text-anchor="middle" class="t">步骤切分</text><rect x="375" y="70" width="145" height="85" rx="12" class="b"/><text x="447" y="105" text-anchor="middle" class="t">步骤标签</text><text x="447" y="132" text-anchor="middle" class="s">人工或自动</text><rect x="555" y="70" width="165" height="85" rx="12" class="c"/><text x="637" y="105" text-anchor="middle" class="t">训练分类评价器</text><text x="637" y="132" text-anchor="middle" class="s">交叉熵损失</text><rect x="755" y="70" width="220" height="85" rx="12" class="c"/><text x="865" y="105" text-anchor="middle" class="t">类别概率</text><text x="865" y="132" text-anchor="middle" class="s">重排序或 RL 步骤奖励</text><path d="M175 112H210M340 112H375M520 112H555M720 112H755" class="a"/></svg>
