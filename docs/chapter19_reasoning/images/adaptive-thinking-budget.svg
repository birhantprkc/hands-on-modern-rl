<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d"><title id="t">自适应思考的停止判断</title><desc id="d">模型在生成和工具反馈之间循环，证据足够时停止，硬上限始终约束成本和时间。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.g{fill:#fff8eb;stroke:#a9772e;stroke-width:1.7}.t{font:600 17px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#9a6a28;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect x="25" y="75" width="150" height="85" rx="12" class="b"/><text x="100" y="125" text-anchor="middle" class="t">开始请求</text><rect x="230" y="75" width="210" height="85" rx="12" class="c"/><text x="335" y="112" text-anchor="middle" class="t">生成或调用工具</text><text x="335" y="139" text-anchor="middle" class="s">获得新的中间证据</text><rect x="500" y="75" width="210" height="85" rx="12" class="b"/><text x="605" y="112" text-anchor="middle" class="t">证据足够回答吗</text><text x="605" y="139" text-anchor="middle" class="s">判断继续计算的价值</text><rect x="770" y="75" width="190" height="85" rx="12" class="c"/><text x="865" y="125" text-anchor="middle" class="t">停止并回答</text><rect x="300" y="200" width="400" height="45" rx="10" class="g"/><text x="500" y="228" text-anchor="middle" class="s">token、时间与工具次数硬上限始终生效</text><path d="M175 117H230M440 117H500M710 117H770" class="a"/><path d="M605 160V185H335V161" class="r"/><path d="M500 200V160" class="r"/></svg>
