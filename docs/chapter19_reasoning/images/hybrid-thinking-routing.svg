<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">混合思考的模式与预算</title><desc id="d">同一个模型可以直接回答简单任务，也可以为复杂任务展开受预算限制的思考。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 18px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="35" y="80" width="175" height="90" rx="12" class="b"/><text x="122" y="119" text-anchor="middle" class="t">同一个模型</text><text x="122" y="146" text-anchor="middle" class="s">共享知识与参数</text><rect x="285" y="25" width="210" height="80" rx="12" class="c"/><text x="390" y="59" text-anchor="middle" class="t">直接回答</text><text x="390" y="86" text-anchor="middle" class="s">简单任务，低延迟</text><rect x="285" y="145" width="210" height="80" rx="12" class="c"/><text x="390" y="179" text-anchor="middle" class="t">展开思考</text><text x="390" y="206" text-anchor="middle" class="s">复杂任务，连续推导</text><rect x="570" y="145" width="190" height="80" rx="12" class="b"/><text x="665" y="179" text-anchor="middle" class="t">思考预算</text><text x="665" y="206" text-anchor="middle" class="s">限制长度与成本</text><rect x="830" y="80" width="140" height="90" rx="12" class="b"/><text x="900" y="132" text-anchor="middle" class="t">最终输出</text><path d="M210 125 285 65M210 125 285 185M495 65 830 110M495 185H570M760 185 830 140" class="a"/></svg>
