<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">内部推理、执行轨迹与用户解释</title><desc id="d">内部推理进入系统执行轨迹，轨迹经权限安全和脱敏处理形成用户解释，同时保留给内部审计。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 17px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="30" y="75" width="180" height="90" rx="12" class="b"/><text x="120" y="112" text-anchor="middle" class="t">内部推理</text><text x="120" y="140" text-anchor="middle" class="s">试错、假设与修正</text><rect x="260" y="75" width="190" height="90" rx="12" class="c"/><text x="355" y="112" text-anchor="middle" class="t">系统执行轨迹</text><text x="355" y="140" text-anchor="middle" class="s">工具、时间与中间状态</text><rect x="500" y="75" width="220" height="90" rx="12" class="b"/><text x="610" y="112" text-anchor="middle" class="t">权限、安全与脱敏</text><text x="610" y="140" text-anchor="middle" class="s">决定哪些内容可以公开</text><rect x="770" y="35" width="190" height="80" rx="12" class="c"/><text x="865" y="69" text-anchor="middle" class="t">用户解释</text><text x="865" y="95" text-anchor="middle" class="s">关键依据与结论</text><rect x="770" y="145" width="190" height="80" rx="12" class="b"/><text x="865" y="179" text-anchor="middle" class="t">内部审计</text><text x="865" y="205" text-anchor="middle" class="s">回放与失败分析</text><path d="M210 120H260M450 120H500M720 120 770 75M450 140 770 185" class="a"/></svg>
