<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">R1-Zero 训练循环</title><desc id="d">基座模型对同一道题采样一组回答，规则验证答案与格式，组内优势进入GRPO更新。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 17px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}.r{stroke:#9a6a28;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect x="30" y="65" width="165" height="95" rx="12" class="b"/><text x="112" y="105" text-anchor="middle" class="t">基座模型</text><text x="112" y="133" text-anchor="middle" class="s">不做 CoT 冷启动</text><rect x="240" y="65" width="190" height="95" rx="12" class="c"/><text x="335" y="104" text-anchor="middle" class="t">组内采样</text><text x="335" y="133" text-anchor="middle" class="s">同题生成 G 条回答</text><rect x="475" y="65" width="190" height="95" rx="12" class="b"/><text x="570" y="104" text-anchor="middle" class="t">规则验证</text><text x="570" y="133" text-anchor="middle" class="s">正确性 + 格式</text><rect x="710" y="65" width="230" height="95" rx="12" class="c"/><text x="825" y="104" text-anchor="middle" class="t">优势与 GRPO 更新</text><text x="825" y="133" text-anchor="middle" class="s">提高高奖励轨迹的概率</text><path d="M195 112H240M430 112H475M665 112H710" class="a"/><path d="M825 160V215H335V161" class="r"/><text x="580" y="238" text-anchor="middle" class="s">更新后的策略继续采样</text></svg>
