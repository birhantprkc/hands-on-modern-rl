<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">从直接生成到推理模型</title><desc id="d">直接生成会让早期错误继续传播，推理模型会先列条件与候选方法，再检查修正并给出答案。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 18px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="35" y="80" width="130" height="80" rx="12" class="b"/><text x="100" y="127" text-anchor="middle" class="t">题目</text><rect x="215" y="35" width="215" height="80" rx="12" class="b"/><text x="322" y="68" text-anchor="middle" class="t">直接生成</text><text x="322" y="94" text-anchor="middle" class="s">早期错误继续传播</text><rect x="215" y="145" width="215" height="80" rx="12" class="c"/><text x="322" y="178" text-anchor="middle" class="t">推理模型</text><text x="322" y="204" text-anchor="middle" class="s">列条件与候选方法</text><rect x="500" y="145" width="190" height="80" rx="12" class="c"/><text x="595" y="178" text-anchor="middle" class="t">检查与修正</text><text x="595" y="204" text-anchor="middle" class="s">发现错误后改换路径</text><rect x="760" y="80" width="190" height="80" rx="12" class="b"/><text x="855" y="127" text-anchor="middle" class="t">最终答案</text><path d="M165 120 215 75M165 120 215 185M430 185H500M690 185 760 130M430 75 760 110" class="a"/></svg>
