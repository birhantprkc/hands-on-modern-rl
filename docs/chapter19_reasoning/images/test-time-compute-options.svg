<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d"><title id="t">三种推理时计算方式</title><desc id="d">固定参数后，可以并行采样、顺序修订或搜索中间步骤，最后通过验证或汇总得到答案。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#55708f"/></marker><style>.b{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.5}.c{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.t{font:600 17px 'Songti SC',serif;fill:#202936}.s{font:14px 'Songti SC',serif;fill:#53606f}.a{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect x="30" y="85" width="170" height="85" rx="12" class="b"/><text x="115" y="120" text-anchor="middle" class="t">固定模型参数</text><text x="115" y="146" text-anchor="middle" class="s">增加推理预算</text><rect x="285" y="20" width="210" height="65" rx="12" class="c"/><text x="390" y="59" text-anchor="middle" class="t">并行采样多条答案</text><rect x="285" y="98" width="210" height="65" rx="12" class="c"/><text x="390" y="137" text-anchor="middle" class="t">顺序检查并修订</text><rect x="285" y="176" width="210" height="65" rx="12" class="c"/><text x="390" y="215" text-anchor="middle" class="t">在中间步骤间搜索</text><rect x="680" y="85" width="250" height="85" rx="12" class="b"/><text x="805" y="120" text-anchor="middle" class="t">验证、选择或汇总</text><text x="805" y="146" text-anchor="middle" class="s">额外计算能否转化为正确率</text><path d="M200 127 285 52M200 127H285M200 127 285 208M495 52 680 110M495 130H680M495 208 680 145" class="a"/></svg>
