<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">CWM 与 DeepSWE 的研究主线</title>
  <desc id="desc">二者都使用可执行软件环境。CWM从观察动作轨迹中学习执行规律，DeepSWE在R2E-Gym中用真实执行反馈做纯强化学习。显式转移模型、价值模型和搜索属于可另行验证的教学扩展。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#55708f"/></marker><style>.box{fill:#f7f8fa;stroke:#5f6b78;stroke-width:1.6}.blue{fill:#eef5ff;stroke:#3973b7;stroke-width:1.8}.gold{fill:#fff8eb;stroke:#a9772e;stroke-width:1.7}.t{font:600 20px 'Songti SC','Noto Serif CJK SC',serif;fill:#202936}.s{font:15px 'Songti SC','Noto Serif CJK SC',serif;fill:#53606f}.arr{stroke:#55708f;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#9a6a28;stroke-width:1.8;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
  <rect x="410" y="25" width="300" height="85" rx="14" class="box"/><text x="560" y="59" text-anchor="middle" class="t">可执行软件环境</text><text x="560" y="87" text-anchor="middle" class="s">Python 解释器 / Docker / 测试</text>
  <rect x="75" y="170" width="425" height="150" rx="14" class="blue"/><text x="287" y="207" text-anchor="middle" class="t">CWM：学习软件世界的规律</text><text x="287" y="241" text-anchor="middle" class="s">观察—动作轨迹 → 中期训练</text><text x="287" y="270" text-anchor="middle" class="s">多任务可验证 RL → 开放权重模型</text><text x="287" y="299" text-anchor="middle" class="s">重点：理解动作会怎样改变环境</text>
  <rect x="620" y="170" width="425" height="150" rx="14" class="blue"/><text x="832" y="207" text-anchor="middle" class="t">DeepSWE：训练长程代码智能体</text><text x="832" y="241" text-anchor="middle" class="s">R2E-Gym 任务 → 长轨迹交互</text><text x="832" y="270" text-anchor="middle" class="s">真实测试反馈 → 纯 RL</text><text x="832" y="299" text-anchor="middle" class="s">重点：扩展 rollout、优化与测试时搜索</text>
  <path d="M495 110 L330 170" class="arr"/><path d="M625 110 L790 170" class="arr"/>
  <rect x="250" y="365" width="620" height="55" rx="12" class="gold"/><text x="560" y="399" text-anchor="middle" class="s">教学扩展：显式转移模型、价值模型、MCTS / Beam Search（需要单独实验验证）</text>
  <path d="M287 320 V365" class="dash"/><path d="M832 320 V365" class="dash"/>
</svg>
